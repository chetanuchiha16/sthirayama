syntax = "proto3";

package sthirayama;
option go_package = "./pb";

service Sthirayama {
  rpc Set(SetRequest) returns (SetResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Del(DelRequest) returns (DelResponse);
  
  rpc Snapshot(SnapshotRequest) returns (stream SnapshotResponse);
}

message SnapshotRequest {}

message SnapshotResponse {
  bytes key = 1;
  bytes value = 2;
  bytes sequence = 3;
}

message SetRequest {
  bytes key = 1;
  bytes val = 2;
}

message GetRequest {
  bytes key = 1;
}

message DelRequest {
  bytes key = 1;
}

message SetResponse {
  bool ok = 1;
}

message GetResponse {
  bytes val = 1;
}

message DelResponse {
  bool ok = 1;
}
