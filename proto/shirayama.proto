syntax = "proto3";

package sthirayama;

service Sthirayama {
  rpc Set(SetRequest) returns (SetResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Del(DelRequest) returns (DelResponse);
}

message SetRequest {
  string key = 1;
  string val = 2;
}

message GetRequest {
  string val = 1;
}

message DelRequest {
  string val = 1;
}

message SetResponse {
  bool ok = 1;
}

message GetResponse {
  string val = 1;
}

message DelResponse {
  bool ok = 1;
}
